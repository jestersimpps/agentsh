[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"

[workspace.dependencies]
agentsh-spec = { path = "crates/spec" }
agentsh-lang = { path = "crates/lang" }
agentsh-platform = { path = "crates/platform" }
agentsh-core = { path = "crates/core" }
agentsh-builtins = { path = "crates/builtins" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2", features = ["serde"] }
schemars = "1"
clap = { version = "4", features = ["derive", "env"] }
toml = "0.8"
directories = "6"
ignore = "0.4"
globset = "0.4"
regex = "1"
strsim = "0.11"
sha2 = "0.10"
similar = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
libc = "0.2"
landlock = "0.4"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
