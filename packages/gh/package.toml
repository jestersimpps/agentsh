name = "gh"
version = "0.1.0"
summary = "GitHub through the gh CLI: a PR in one record, failing checks, failed CI logs without timestamps, your PR list"
caps = ["read", "exec", "net"]
detect = [".github"]

[[command]]
name = "pr"
summary = "one pull request: state, branches, review, size and a checks summary with the failing names"
params = [
  { name = "number", type = "arg", positional = true, doc = "PR number, URL or branch (default: the current branch's PR)" },
  { name = "repo", type = "str", doc = "owner/name (default: this repo)" },
]
returns = "record"
examples = ["gh.pr", "gh.pr 123", "gh.pr 42 repo:\"cli/cli\""]
run = '''
let argv = ["gh", "pr", "view"]
if $number != null { let argv = $argv + [str($number)] }
if $repo != null { let argv = $argv + ["--repo", $repo] }
let fields = "number,title,state,isDraft,author,baseRefName,headRefName,reviewDecision,mergeable,url,additions,deletions,changedFiles,statusCheckRollup"
let pr = (exec ($argv + ["--json", $fields]) parse:"json")
let passed = 0
let pending = 0
let failing = []
for $c in $pr.statusCheckRollup {
  let result = get($c, "conclusion", get($c, "state", ""))
  let name = get($c, "name", get($c, "context", "?"))
  if $result in ["SUCCESS", "NEUTRAL", "SKIPPED"] { let passed = $passed + 1 } else {
    if $result in ["FAILURE", "TIMED_OUT", "CANCELLED", "ERROR", "ACTION_REQUIRED", "STARTUP_FAILURE"] {
      let failing = $failing + [$name]
    } else { let pending = $pending + 1 }
  }
}
let state = $pr.state
let failed = null
if len($failing) > 0 { let failed = join($failing, ", ") }
if $pr.isDraft { let state = "DRAFT" }
{
  pr: "#${pr.number} ${pr.title}",
  state: $state,
  author: $pr.author.login,
  branches: "${pr.headRefName} -> ${pr.baseRefName}",
  review: $pr.reviewDecision,
  mergeable: $pr.mergeable,
  size: "+${pr.additions} -${pr.deletions} in ${pr.changedFiles} files",
  checks: "$passed passed, ${len($failing)} failing, $pending pending",
  failing: $failed,
  url: $pr.url
}
'''

[[command]]
name = "checks"
summary = "a PR's checks that didn't pass (all:true for every check)"
params = [
  { name = "number", type = "arg", positional = true, doc = "PR number, URL or branch (default: current branch)" },
  { name = "repo", type = "str", doc = "owner/name" },
  { name = "all", type = "bool", doc = "include passing and skipped checks" },
]
returns = "table of {name, state, link}, or a one-line summary when everything passed"
examples = ["gh.checks", "gh.checks 123 all:true"]
run = '''
let argv = ["gh", "pr", "checks"]
if $number != null { let argv = $argv + [str($number)] }
if $repo != null { let argv = $argv + ["--repo", $repo] }
let checks = (exec ($argv + ["--json", "name,state,bucket,link"]) ok:[0, 1, 8] parse:"json")
let rows = []
for $c in $checks {
  if $all or not ($c.bucket in ["pass", "skipping"]) { let rows = $rows + [{name: $c.name, state: $c.state, link: $c.link}] }
}
if len($rows) == 0 { "all ${len($checks)} checks passed" } else { $rows }
'''

[[command]]
name = "run_log"
summary = "the log of a CI run's failed steps, grouped by step, without the per-line job/step/timestamp prefix"
params = [
  { name = "run", type = "arg", positional = true, required = true, doc = "run id (from a check's link: .../runs/<id>/job/...)" },
  { name = "repo", type = "str", doc = "owner/name" },
  { name = "job", type = "arg", doc = "only this job id" },
]
returns = "text"
examples = ["gh.run_log 9876543210", "gh.run_log 9876543210 job:2468"]
run = '''
let argv = ["gh", "run", "view", str($run), "--log-failed"]
if $job != null { let argv = ["gh", "run", "view", "--job", str($job), "--log-failed"] }
if $repo != null { let argv = $argv + ["--repo", $repo] }
let out = []
let step = ""
for $l in (exec $argv timeout:2m parse:"lines") {
  let m = match($l, "^([^\t]*)\t([^\t]*)\t\S+ ?(.*)$")
  if $m == null { let out = $out + [$l] } else {
    if $m[2] != $step {
      let step = $m[2]
      let out = $out + ["== ${m[1]} / $step"]
    }
    let out = $out + [$m[3]]
  }
}
join($out, "\n")
'''

[[command]]
name = "prs"
summary = "pull requests as a table (default: yours, open)"
params = [
  { name = "repo", type = "str", doc = "owner/name" },
  { name = "author", type = "str", doc = "default @me; \"\" for anyone" },
  { name = "state", type = "str", doc = "open (default), closed, merged or all" },
  { name = "n", type = "int", doc = "how many (default 20)" },
]
returns = "table of {number, title, branch, review, draft, updated}"
examples = ["gh.prs", "gh.prs repo:\"cli/cli\" author:\"\" n:5"]
run = '''
let who = "@me"
if $author != null { let who = $author }
let st = "open"
if $state != null { let st = $state }
let count = 20
if $n != null { let count = $n }
let argv = ["gh", "pr", "list", "--state", $st, "--limit", str($count), "--json", "number,title,headRefName,reviewDecision,isDraft,updatedAt"]
if $who != "" { let argv = $argv + ["--author", $who] }
if $repo != null { let argv = $argv + ["--repo", $repo] }
for $p in (exec $argv parse:"json") {
  let day = split($p.updatedAt, "T")
  {number: $p.number, title: $p.title, branch: $p.headRefName, review: $p.reviewDecision, draft: $p.isDraft, updated: $day[0]}
}
'''
