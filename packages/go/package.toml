name = "go"
version = "0.1.0"
summary = "Go modules: go test failure digests, go vet as lint"
caps = ["read", "exec"]
detect = ["go.mod"]

[check]
parser = "go"
recognize = ["go test*"]

[check.test]
cmd = ["go", "test", "./..."]

[check.build]
cmd = ["go", "build", "./..."]

[check.lint]
cmd = ["go", "vet", "./..."]
